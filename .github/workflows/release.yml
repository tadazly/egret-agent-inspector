name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version plugins/egret-agent-inspector/.codex-plugin/plugin.json)"
          test "v${version}" = "$GITHUB_REF_NAME"
          python scripts/validate.py
          python -m unittest discover -s tests -v

      - name: Build extension archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd plugins/egret-agent-inspector/extension && zip -qr "$GITHUB_WORKSPACE/dist/egret-agent-inspector-extension-${GITHUB_REF_NAME}.zip" . -x '*/__pycache__/*')
          python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Egret Agent Inspector $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag

  notify-s-plugins:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify s-plugins
        env:
          GH_TOKEN: ${{ secrets.S_PLUGINS_DISPATCH_TOKEN }}
          PLUGIN_MANIFEST: plugins/egret-agent-inspector/.codex-plugin/plugin.json
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Repository secret S_PLUGINS_DISPATCH_TOKEN is not configured." >&2
            exit 1
          fi
          jq -n \
            --slurpfile plugin "$PLUGIN_MANIFEST" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg path "./plugins/egret-agent-inspector" \
            '{
              event_type: "plugin-released",
              client_payload: {
                name: $plugin[0].name,
                version: $plugin[0].version,
                description: $plugin[0].description,
                source: {url: $plugin[0].repository, path: $path, ref: $ref},
                interface: {
                  displayName: $plugin[0].interface.displayName,
                  shortDescription: $plugin[0].interface.shortDescription,
                  longDescription: $plugin[0].interface.longDescription,
                  developerName: $plugin[0].interface.developerName,
                  websiteURL: $plugin[0].interface.websiteURL
                }
              }
            }' | gh api --method POST repos/tadazly/s-plugins/dispatches --input -
          echo "Dispatched plugin-released for egret-agent-inspector@${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
